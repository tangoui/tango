# Tango release: runs when a version tag (v0.1.0, v0.2.0-rc.1, ...) is pushed.
# See docs/release.md for the version rules and the release checklist.
#
#   verify   tag matches runtime-js/package.json and CHANGELOG.md; vet + tests
#   tan      tan binaries for darwin/linux/windows × amd64/arm64 + checksums
#   npm      npm publish --provenance of @tangoui/runtime (skipped without
#            the NPM_TOKEN secret)
#   release  GitHub release (draft) with the binaries, release notes and the
#            API compatibility report against the previous tag
#   docs     builds the documentation site and deploys it to GitHub Pages
#
# Tags of the cmd/tan module (cmd/tan/v0.1.0) do not match "v*" and do not
# trigger this workflow; they only make `go install .../cmd/tan@v0.1.0` work.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0. Publishing to npm and Pages only happens for tags."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Check versions
        id: v
        run: |
          set -euo pipefail
          tag="$TAG"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $tag is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          version="${tag#v}"
          npm_version="$(node -p 'require("./runtime-js/package.json").version')"
          if [ "$npm_version" != "$version" ]; then
            echo "::error::runtime-js/package.json has version $npm_version, the tag says $version (see docs/release.md)"
            exit 1
          fi
          if ! grep -Eq "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' cmd/tan/go.mod; then
            echo "::error::cmd/tan/go.mod has a replace directive; versioned go install cannot use it. Keep local module wiring in go.work (docs/release.md, step 4)."
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: |
          go vet ./... && go vet -tags tango_dev ./... && (cd cmd/tan && go vet ./...)
          go test ./... && go test -tags tango_dev ./... && (cd cmd/tan && go test ./...)

      - name: Test the JS runtime
        working-directory: runtime-js
        run: npm ci && npm test

  tan:
    name: tan binaries
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Cross-compile tan
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              name="tan_${VERSION}_${goos}_${goarch}"
              ext=""; [ "$goos" = windows ] && ext=.exe
              mkdir -p "stage/$name"
              # -buildvcs=false: otherwise `tan version` reports the cmd/tan
              # module's VCS pseudo-version instead of main.version.
              (cd cmd/tan && GOOS=$goos GOARCH=$goarch go build -trimpath -buildvcs=false \
                -ldflags "-s -w -X main.version=$VERSION" -o "../../stage/$name/tan$ext" .)
              cp LICENSE README.md "stage/$name/"
              if [ "$goos" = windows ]; then
                (cd stage && zip -qr "../dist/$name.zip" "$name")
              else
                tar -C stage -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum * > "tan_${VERSION}_checksums.txt")
          ls -l dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tan-binaries
          path: dist/
          if-no-files-found: error

  npm:
    name: publish @tangoui/runtime
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check for NPM_TOKEN
        id: token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set: skipping npm publish of @tangoui/runtime@$VERSION. Add it under Settings → Secrets and variables → Actions, then re-run this job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.token.outputs.skip != 'true'

      - uses: actions/setup-node@v7.1.0
        if: steps.token.outputs.skip != 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        if: steps.token.outputs.skip != 'true'
        working-directory: runtime-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if npm view "@tangoui/runtime@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@tangoui/runtime@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm ci
          dist_tag=latest
          [ "$PRERELEASE" = true ] && dist_tag=next
          # prepublishOnly builds and tests; files: dist, README.md, LICENSE.
          npm publish --provenance --access public --tag "$dist_tag"

  release:
    name: GitHub release
    needs: [verify, tan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the previous tag, for the API report

      - uses: actions/download-artifact@v8.0.2
        with:
          name: tan-binaries
          path: dist

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: API compatibility report
        run: |
          set -euo pipefail
          # Against the previous version tag (docs/release.md, "API 稳定性");
          # the first tag has none. Breaks are reported, never fatal here:
          # the API workflow already gated them on main.
          git fetch --quiet --tags origin
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          : > api-report.md
          if [ -n "$prev" ]; then
            out="$(ALLOW_API_BREAK=1 bash scripts/apidiff.sh "$prev" 2>&1 || true)"
            {
              echo
              echo "<details><summary>API 兼容性报告 / API compatibility report (vs $prev)</summary>"
              echo
              echo '```text'
              echo "$out"
              echo '```'
              echo
              echo "</details>"
            } > api-report.md
          fi
          cat api-report.md

      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## 安装 / Install

          \`\`\`bash
          go get github.com/tangoui/tango@v$VERSION
          go install github.com/tangoui/tango/cmd/tan@v$VERSION   # or download a tan binary below
          npm install @tangoui/runtime@$VERSION                    # optional, for bundled front ends
          \`\`\`

          Desktop backends are verified on macOS; Windows and Linux are implemented but not yet verified on hardware. Mobile (iOS, Android) is experimental.
          EOF
          cat api-report.md >> notes.md
          cat notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run, or a release made by hand: refresh assets and notes.
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            # A draft: a maintainer reviews it and presses Publish (docs/release.md).
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
              --title "Tango $TAG" --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"
          fi

  docs:
    name: documentation site
    needs: verify
    if: github.event_name == 'push' && needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Component screenshots
        continue-on-error: true # the catalog page explains how to produce them if this fails
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
          go run ./examples/ui-gallery

      - name: Build the site
        working-directory: site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run docs:test
          npm run docs:build
          npm run docs:links

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist

      - id: deploy
        uses: actions/deploy-pages@v5.0.1
