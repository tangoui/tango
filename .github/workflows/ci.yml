# Tango CI: lint, unit tests and real-window smoke tests on Linux, macOS
# and Windows, mobile builds (iOS simulator run, Android APK + emulator),
# Releases are built by release.yml. See docs/ci.md and docs/release.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Smoke programs stretch their own timeouts by this factor on CI runners.
  TANGO_SMOKE_TIMEOUT_SCALE: "3"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime-js/package-lock.json

      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (native)
        run: |
          go vet ./...
          go vet -tags tango_dev ./...
          (cd cmd/tan && go vet ./...)

      - name: Build tan without the workspace
        working-directory: cmd/tan
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "::error::cmd/tan/go.mod must not contain replace directives; use go.work for local development"
            exit 1
          fi
          go build -mod=readonly -o "$RUNNER_TEMP/tan" .

      - name: go vet (cross)
        env:
          CGO_ENABLED: "0"
        run: |
          status=0
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "::group::go vet $target"
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go vet ./... || status=1
            go vet -tags tango_dev ./... || status=1   # development features (docs/dev-builds.md)
            (cd cmd/tan && go vet ./...) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: runtime-js (npm ci, npm test)
        working-directory: runtime-js
        run: |
          npm ci
          npm test

      - name: runtime-js bundle is up to date
        run: |
          git diff --exit-code -- runtime-js/runtimejs/tango.iife.js || {
            echo "::error::runtime-js/runtimejs/tango.iife.js is stale: run 'npm run build' in runtime-js and commit it"
            exit 1
          }

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # The GL backend's tests need EGL, libepoxy and Mesa (llvmpipe); newer Ubuntu
      # runner images no longer ship libEGL.
      - name: Install EGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libepoxy0 libgl1 libopengl0 libgl1-mesa-dri libgles2

      - name: Pick race detector
        run: |
          # -race needs cgo. Linux and macOS runners have a C compiler;
          # on Windows use the preinstalled MinGW gcc if it is on PATH.
          if [ "$RUNNER_OS" = Windows ] && ! command -v gcc >/dev/null 2>&1; then
            echo "::warning::gcc not found on the Windows runner: tests run without -race"
            echo "CGO_ENABLED=0" >>"$GITHUB_ENV"
            echo "RACE=" >>"$GITHUB_ENV"
          else
            echo "CGO_ENABLED=1" >>"$GITHUB_ENV"
            echo "RACE=-race" >>"$GITHUB_ENV"
          fi

      # The race detector slows the large UI packages (ui, internal/render/gpu, the
      # gallery) past Go's 10-minute test timeout. Their code is
      # single-threaded, so they run without -race; the concurrent rest of
      # the framework keeps it.
      - name: go test (module root)
        run: |
          slow='/ui$|/ui/editor|/ui/chart|/internal/render/gpu|/examples/ui-gallery'
          bash scripts/ci-go-test.sh $RACE -timeout 20m $(go list ./... | grep -Ev "$slow")
          bash scripts/ci-go-test.sh -timeout 40m $(go list ./... | grep -E "$slow" | grep -v /examples/ui-gallery)
          # The gallery's full text-contrast sweep (every page x six themes,
          # three times) has its own job below; -short skips it here.
          bash scripts/ci-go-test.sh -short -timeout 40m ./examples/ui-gallery/...

      # Development features (hot reload, automation, dev proxy) are only
      # built with -tags tango_dev; the default build above is production.
      - name: go test -tags tango_dev (module root)
        run: |
          slow='/ui$|/ui/editor|/ui/chart|/internal/render/gpu|/examples/ui-gallery'
          bash scripts/ci-go-test.sh $RACE -tags tango_dev -timeout 20m $(go list -tags tango_dev ./... | grep -Ev "$slow")
          # The gallery has no development features: the default run above
          # covers it, so it is not repeated here.
          bash scripts/ci-go-test.sh -tags tango_dev -timeout 40m $(go list -tags tango_dev ./... | grep -E "$slow" | grep -v /examples/ui-gallery)

      - name: go test (cmd/tan)
        working-directory: cmd/tan
        run: bash ../scripts/ci-go-test.sh $RACE ./...

  # The gallery's full text-contrast sweep renders every page in six themes
  # three times: too slow for every pull request, so it runs on pushes to
  # main (and on demand) with its own budget.
  gallery-contrast:
    name: gallery contrast
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Text contrast on every gallery page
        run: go test -run TestGalleryTextContrast -timeout 80m ./examples/ui-gallery/

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SMOKE_OUT: ${{ github.workspace }}/build/smoke
      SMOKE_SCREENSHOT: "1"
      SMOKE_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Install GTK, WebKitGTK and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 \
            xvfb xauth dbus dbus-x11 imagemagick weston
          # Ubuntu 24.04 restricts unprivileged user namespaces, which
          # WebKit's sandboxed web process may need.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Smoke (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # No notification server on a headless session.
          # notify: no notification daemon. hotkey: Xvfb's default keymap has
          # no F19 (notify-demo registers CmdOrCtrl+Alt+Shift+F19 so it cannot
          # clash with real shortcuts). find/download/camera: webview-demo
          # checks that headless WebKitGTK cannot pass (no camera; find-in-page
          # and download reporting differ under Xvfb).
          TANGO_SMOKE_SKIP: notify,hotkey,find,download,camera
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" bash scripts/smoke.sh

      - name: Smoke canvas (Linux, Wayland via headless Weston)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          NO_AT_BRIDGE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=tango-wl --idle-time=0 &
          for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/tango-wl" ] && break; sleep 0.2; done
          WAYLAND_DISPLAY=tango-wl GDK_BACKEND=wayland \
            dbus-run-session -- bash scripts/smoke.sh desktop smokecanvas

      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        env:
          # Hosted macOS runners have no awake display, so CVDisplayLink
          # pauses: frame-pacing checks (invalidate, coalesce, invalidate-at)
          # are reported as SKIP instead of FAIL.
          TANGO_SMOKE_SKIP: displaylink
        run: bash scripts/smoke.sh

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Upload smoke logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: smoke-${{ matrix.os }}
          path: |
            build/smoke/
            !build/smoke/bin/
          if-no-files-found: ignore
          retention-days: 14

  mobile-ios:
    name: mobile (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SMOKE_OUT: ${{ github.workspace }}/build/smoke
      SMOKE_MOBILE_WAIT: "180"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|-- iOS' || true

      # Builds with mobile/ios/build.sh, boots the first available iPhone
      # simulator, installs, launches, waits for the page to message Go
      # and takes a screenshot.
      - name: Build and run examples/mobile-hello
        timeout-minutes: 30
        run: bash scripts/smoke.sh ios

      - name: Upload iOS logs and screenshot
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-ios
          path: build/smoke/
          if-no-files-found: ignore
          retention-days: 14

  mobile-android:
    name: mobile (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SMOKE_OUT: ${{ github.workspace }}/build/smoke
      SMOKE_MOBILE_WAIT: "240"
      TANGO_GRADLE_ARGS: --no-daemon --stacktrace
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Android SDK and NDK
        run: |
          # The runner image ships the SDK (licenses accepted) and several NDKs.
          echo "ANDROID_HOME=$ANDROID_HOME"
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
            ndk="$ANDROID_HOME/ndk/28.2.13676358"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >>"$GITHUB_ENV"
          echo "NDK: $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" >/dev/null

      - name: Build APK (examples/mobile-hello)
        run: |
          mkdir -p "$SMOKE_OUT"
          bash mobile/android/build.sh examples/mobile-hello | tee "$SMOKE_OUT/android.build.log"
          apk="$(sed -n 's/^APK: //p' "$SMOKE_OUT/android.build.log" | tail -n 1)"
          test -f "$apk"
          echo "SMOKE_APK=$apk" >>"$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-hello-apk
          path: ${{ env.SMOKE_APK }}
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Informational until the emulator run has proved stable: set the
      # repository variable ANDROID_EMULATOR_REQUIRED=true to make it gate.
      - name: Run in the emulator
        id: emulator
        continue-on-error: ${{ vars.ANDROID_EMULATOR_REQUIRED != 'true' }}
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke.sh android

      - name: Upload Android logs and screenshot
        if: failure() || steps.emulator.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-android
          path: build/smoke/
          if-no-files-found: ignore
          retention-days: 14
