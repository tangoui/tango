# API checks: Go golden files and tiers (internal/cmd/apitxt), incompatible
# Go changes (scripts/apidiff.sh), the JS runtime API report
# (runtime-js/etc/runtime.api.md) and the jsapi wire contract
# (api/jsapi-methods.txt), and a CHANGELOG entry for API changes. A
# separate workflow so that adding or removing the api-break label re-runs
# only this check.
# See docs/ci.md and docs/release.md ("API 稳定性").
name: API

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      base:
        description: "Base commit, tag or branch to compare with"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apidiff:
    name: apidiff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime-js/package-lock.json

      - name: Resolve the base commit
        env:
          # PR: the base branch tip (the checkout is the merge commit, so this
          # is exactly the PR's change). Push: the previous tip of main.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'workflow_dispatch' && inputs.base || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "::notice::no base commit to compare with; apidiff and the CHANGELOG check are skipped"
            BASE=
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] &&
               git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null; then
            BASE="origin/$BASE"   # a branch name: use the remote branch
          fi
          if [ -n "$BASE" ] && ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::notice::base $BASE is not in the history (force push?); apidiff and the CHANGELOG check are skipped"
            BASE=
          fi
          echo "API_BASE=$BASE" >>"$GITHUB_ENV"

      # Golden files api/go/*.txt up to date, every package in api/tiers.txt,
      # allowlist entries exist, experimental and split packages say so in
      # their package doc, and stable symbols reference only stable ones
      # (docs/specs/api-stability.md §4.3). Every problem fails the job.
      - name: Check API golden files and tiers
        run: go run ./internal/cmd/apitxt -check

      # @tangoui/runtime: api:check builds dist/ and runs API Extractor in
      # CI mode, failing when etc/runtime.api.md differs from the sources
      # (update locally with npm run api:update). contract:check and the
      # two test files compare src/api/*.ts, the ErrorCode union and the
      # docs error table with api/jsapi-methods.txt, and prove both checks
      # catch deliberate drift on temp copies. See docs/runtime-api.md
      # ("API 稳定性").
      - name: Check JS runtime API report and wire contract
        working-directory: runtime-js
        run: |
          npm ci
          npm run api:check
          npm run contract:check
          node --test test/api-report.test.mjs test/contract.test.mjs

      # The Go side of api/jsapi-methods.txt: methods, events and error
      # codes extracted from jsapi's registration code and cross-checked
      # with a real Install.
      - name: Check jsapi wire contract
        run: go test ./jsapi -run '^TestWireContract' -count=1

      - name: Check API compatibility
        if: env.API_BASE != ''
        env:
          ALLOW_API_BREAK: ${{ (contains(github.event.pull_request.labels.*.name, 'api-break') || contains(github.event.head_commit.message, '[api-break]')) && '1' || '' }}
        run: bash scripts/apidiff.sh "$API_BASE"

      - name: Check CHANGELOG for API changes
        if: env.API_BASE != ''
        env:
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '' }}
        run: |
          # TODO(2026-11-21): one week after this check landed, turn the
          # warning into a failure (exit 1), as docs/release.md describes.
          # Golden files whose change means a public API change: Go
          # (api/go/), the JS runtime (runtime-js/etc/runtime.api.md) and
          # the jsapi wire names (api/jsapi-methods.txt).
          changed="$(git diff --name-only "$API_BASE" HEAD)"
          api_files="$(grep -E '^(api/go/|api/jsapi-methods\.txt$|runtime-js/etc/runtime\.api\.md$)' <<<"$changed" || true)"
          if [ -n "$api_files" ] && ! grep -qx 'CHANGELOG.md' <<<"$changed"; then
            list="$(tr '\n' ' ' <<<"$api_files")"
            if [ "$NO_CHANGELOG" = 1 ]; then
              echo "::notice::API golden files changed without a CHANGELOG.md entry (no-changelog label): $list"
            else
              echo "::warning::API golden files changed but CHANGELOG.md did not ($list): describe the API change under 未发布 in CHANGELOG.md, or label the PR no-changelog"
            fi
          fi
