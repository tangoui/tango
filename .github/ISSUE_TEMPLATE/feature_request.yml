name: 功能请求 / Feature request
description: 提议新功能或改进 / Propose a new feature or an improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你想做什么、现在为什么做不到或很麻烦。/ What you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案 / Proposal
      description: 期望的 API 或行为，可以附代码草图。/ The API or behavior you have in mind; a code sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代办法 / Alternatives
      description: 现在的变通办法，或其他可能的设计。/ Workarounds or other designs you considered.
  - type: dropdown
    id: platforms
    attributes:
      label: 涉及的平台 / Platforms
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - 全部 / all
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与 / Contribution
      options:
        - label: 我愿意提交实现（会先在这里讨论设计）。/ I would like to implement it (after discussing the design here).
