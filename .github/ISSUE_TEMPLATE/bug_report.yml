name: 问题报告 / Bug report
description: Tango 的行为和文档或预期不一致 / Something does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告！安全漏洞请**不要**在这里提交，请按 SECURITY.md 使用私密漏洞报告。
        Thanks for the report! Please do **not** report security vulnerabilities here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际行为和你期望的行为。/ What you saw and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 最好附一个最小的可运行示例（main.go + 页面），或指出用哪个 examples/ 能复现。/ A minimal runnable example is best.
      placeholder: |
        1. tan init -template vanilla repro
        2. ……
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iOS（模拟器 / simulator）
        - iOS（真机 / device）
        - Android（模拟器 / emulator）
        - Android（真机 / device）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及部分 / Area
      multiple: true
      options:
        - 核心 / core (App, Surface, threading)
        - 窗口与 WebView / windows & WebView
        - IPC / bind / @tangoui/runtime
        - jsapi
        - sys/ 系统能力 / system capabilities
        - service/
        - 自绘 UI / self-drawn UI (ui, uihost)
        - tan 命令行 / CLI
        - 打包与签名 / packaging & signing
        - 文档 / docs
        - 其他 / other
  - type: input
    id: versions
    attributes:
      label: 版本 / Versions
      description: Tango 版本或提交、`tan version`、Go 版本、系统与 WebView 版本。/ Tango version or commit, tan version, Go, OS and WebView versions.
      placeholder: "tango v0.1.0, tan 0.1.0, go1.27.2, macOS 26.1, WebKit 21624"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图 / Logs and screenshots
      description: 终端输出、页面 console、崩溃信息。会自动格式化为代码。/ Will be formatted as code.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我搜索过已有 issue，没有重复。/ I searched existing issues.
          required: true
        - label: 我用最新的 main 或最新发布版本试过。/ I tried the latest release or main.
