<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Tango</title>
  <desc id="desc">One Go codebase. Desktop and mobile. A navy background with blue and mint orbital rings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101b32"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#61a5ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3b6cf6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3b6cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <circle cx="1080" cy="160" r="320" fill="url(#glow)"/>
    <g fill="none" stroke="#b4d0ff" stroke-opacity=".07">
      <path d="M0 80H1280M0 160H1280M0 240H1280M80 0V320M400 0V320M720 0V320M1040 0V320"/>
      <circle cx="1080" cy="160" r="235"/>
      <circle cx="1080" cy="160" r="166"/>
    </g>
    <circle cx="1080" cy="160" r="104" fill="none" stroke="url(#orbit)" stroke-width="30"/>
    <circle cx="1080" cy="160" r="43" fill="#19b394"/>
    <circle cx="1208" cy="86" r="5" fill="#93baff"/>
    <circle cx="915" cy="160" r="4" fill="#41d7b7"/>
    <path d="M60 61H91" stroke="#41d7b7" stroke-width="3"/>
    <text x="104" y="66" fill="#b4c5df" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="3">THE GO APPLICATION FRAMEWORK</text>
    <text x="58" y="155" fill="#f5f8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="-3">Tango</text>
    <text x="62" y="206" fill="#c1cee3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">One Go codebase. Desktop and mobile.</text>
    <text x="62" y="268" fill="#8c9fbb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="1.4">SYSTEM WEBVIEW</text>
    <circle cx="220" cy="264" r="2" fill="#41d7b7"/>
    <text x="236" y="268" fill="#8c9fbb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="1.4">GO-DRAWN UI</text>
    <circle cx="366" cy="264" r="2" fill="#41d7b7"/>
    <text x="382" y="268" fill="#8c9fbb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="1.4">NATIVE CAPABILITIES</text>
  </g>
</svg>
