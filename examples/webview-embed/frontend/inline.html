<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
         background: repeating-linear-gradient(45deg, #722ed1 0 18px, #9254de 18px 36px); }
  .bar { background: rgba(0,0,0,.35); padding: 6px 10px; }
</style>
</head>
<body>
  <div class="bar">列表里的第二个 WebView：顶部</div>
  <div class="bar" id="t">时钟</div>
  <div class="bar">底部（滚动时被列表裁剪）</div>
<script>
  setInterval(() => { document.getElementById('t').textContent = new Date().toLocaleTimeString(); }, 500);
</script>
</body>
</html>
