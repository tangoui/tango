org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# App identity (tangoAppId, tangoVersionName, tangoVersionCode, tangoMinSdk,
# tangoTargetSdk, tangoKeystore, tangoKeyAlias) is passed by tan build with
# ORG_GRADLE_PROJECT_* environment variables from tan.json (never -P on the
# command line); app/build.gradle has the defaults.

# Java-only host: keep AGP 9 from adding Kotlin (and kotlin-stdlib) to the app.
android.builtInKotlin=false
